name: Build - Windows Server OpenGL

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build - Windows"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"

jobs:
  build-windows-server:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: windows-server-opengl-x64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Read vcpkg baseline
        id: vcpkg
        shell: pwsh
        run: |
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $commit = $json.'builtin-baseline'
          if ($commit -notmatch '^[0-9a-f]{40}$') {
            throw 'vcpkg.json must contain a full 40-character builtin-baseline.'
          }
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-binary-cache
            ${{ github.workspace }}/build/windows-server/vcpkg_installed
            ${{ github.workspace }}/vcpkg/downloads
            ${{ github.workspace }}/vcpkg/packages
          key: windows-server-vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Install vcpkg
        uses: lukka/run-vcpkg@a400452f634fe49e9f18d388aeb1809dcc642136
        with:
          vcpkgGitCommitId: ${{ steps.vcpkg.outputs.commit }}

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v3.31.6

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure OpenGL client for Windows Server
        shell: pwsh
        run: |
          cmake -S . -B build/windows-server -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DOTCLIENT_WINDOWS_TARGET=0x0A00 `
            -DBUILD_STATIC_LIBRARY=ON `
            -DBUILD_TESTING=OFF

      - name: Build client
        shell: pwsh
        run: |
          # Build and verify the generated protocol headers explicitly. The
          # otclient_core target also depends on this target in CMake, so this
          # step doubles as an early, clear diagnostic if protoc ever breaks.
          cmake --build build/windows-server --target protobuf

          $soundsHeader = "$env:GITHUB_WORKSPACE/build/windows-server/src/protobuf/sounds.pb.h"
          if (-not (Test-Path -LiteralPath $soundsHeader)) {
            throw "Protobuf generation did not create $soundsHeader"
          }

          cmake --build build/windows-server --target otclient

      - name: Prepare runnable package
        shell: pwsh
        run: |
          $artifact = "$env:GITHUB_WORKSPACE/artifacts/windows-server"
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null

          $exe = @(
            "$env:GITHUB_WORKSPACE/otclient.exe",
            "$env:GITHUB_WORKSPACE/build/windows-server/bin/otclient.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1

          if (-not $exe) {
            throw 'The main otclient.exe was not generated.'
          }

          # Keep the public executable name identical to the regular Windows
          # package. This build uses x64-windows-static + BUILD_STATIC_LIBRARY,
          # therefore CMake selects the static MSVC runtime (/MT) in Release.
          $packagedExe = "$artifact/CrystalOTC.exe"
          Copy-Item -LiteralPath $exe -Destination $packagedExe

          # Resolve PE imports recursively. System DLLs stay provided by
          # Windows; every non-system DLL must be copied beside CrystalOTC.exe.
          # This catches dynamically loaded dependencies without blindly
          # shipping the complete vcpkg or Visual Studio runtime directories.
          $searchDirs = @(
            (Split-Path $exe),
            "$env:GITHUB_WORKSPACE/build/windows-server/bin",
            "$env:GITHUB_WORKSPACE/build/windows-server/vcpkg_installed/x64-windows-static/bin"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -Unique

          function Get-PeImports([string]$binary) {
            $imports = & dumpbin.exe /nologo /dependents $binary
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin failed while inspecting $binary"
            }
            @($imports | ForEach-Object {
              if ($_ -match '^\s+([A-Za-z0-9_.+-]+\.dll)\s*$') {
                $matches[1]
              }
            } | Sort-Object -Unique)
          }

          $systemDirectories = @(
            "$env:SystemRoot/System32",
            "$env:SystemRoot/SysWOW64"
          )
          $pending = [System.Collections.Generic.Queue[string]]::new()
          $pending.Enqueue($packagedExe)
          $visited = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $bundled = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $system = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $missing = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)

          while ($pending.Count -gt 0) {
            $binary = $pending.Dequeue()
            if (-not $visited.Add((Resolve-Path -LiteralPath $binary).Path)) { continue }

            foreach ($dll in Get-PeImports $binary) {
              $systemPath = $systemDirectories |
                ForEach-Object { Join-Path $_ $dll } |
                Where-Object { Test-Path -LiteralPath $_ } |
                Select-Object -First 1
              if ($systemPath) {
                $system.Add($dll) | Out-Null
                continue
              }

              $packagedDll = Join-Path $artifact $dll
              if (-not (Test-Path -LiteralPath $packagedDll)) {
                $sourceDll = $searchDirs |
                  ForEach-Object { Join-Path $_ $dll } |
                  Where-Object { Test-Path -LiteralPath $_ } |
                  Select-Object -First 1
                if (-not $sourceDll) {
                  $missing.Add($dll) | Out-Null
                  continue
                }
                Copy-Item -LiteralPath $sourceDll -Destination $packagedDll
              }

              $bundled.Add($dll) | Out-Null
              $pending.Enqueue($packagedDll)
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing redistributable DLLs: $($missing -join ', ')"
          }

          $dynamicMsvcRuntime = (@($bundled) + @($system)) |
            Where-Object { $_ -match '^(vcruntime|msvcp|concrt)[0-9_]*\.dll$' }
          if ($dynamicMsvcRuntime.Count -gt 0) {
            throw "The /MT package unexpectedly imports dynamic MSVC runtime DLLs: $($dynamicMsvcRuntime -join ', ')"
          }

          foreach ($item in @('init.lua', 'server_config.lua', 'data', 'modules', 'mods')) {
            if (Test-Path -LiteralPath $item) {
              Copy-Item -LiteralPath $item -Destination $artifact -Recurse -Force
            }
          }

          @(
            'CrystalOTC Windows x64 dependency report'
            'Target: Windows 10/11 x64'
            'Configuration: Release'
            'MSVC runtime: static (/MT)'
            ''
            'Bundled non-system DLLs:'
            $(if ($bundled.Count) { $bundled | Sort-Object } else { '(none; dependencies are statically linked)' })
            ''
            'Windows system DLLs:'
            $system | Sort-Object
          ) | Set-Content -LiteralPath "$artifact/dependency-report.txt" -Encoding UTF8

      - name: Validate clean redistributable package
        shell: pwsh
        run: |
          $artifact = "$env:GITHUB_WORKSPACE/artifacts/windows-server"
          $exe = "$artifact/CrystalOTC.exe"

          foreach ($required in @('CrystalOTC.exe', 'init.lua', 'data', 'modules', 'mods', 'dependency-report.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $artifact $required))) {
              throw "Required runtime file is missing from package: $required"
            }
          }

          $headers = & dumpbin.exe /nologo /headers $exe
          if ($LASTEXITCODE -ne 0 -or @($headers -match 'machine \(x64\)').Count -eq 0) {
            throw 'Packaged executable is not a valid x64 PE image.'
          }

          # Run only from the clean package directory. If the process remains
          # alive, startup succeeded; terminate it after the smoke-test window.
          $process = Start-Process -FilePath $exe -WorkingDirectory $artifact -PassThru
          if ($process.WaitForExit(15000)) {
            if ($process.ExitCode -ne 0) {
              throw "CrystalOTC exited during clean-folder smoke test with code $($process.ExitCode)."
            }
          } else {
            Stop-Process -Id $process.Id -Force
          }

      - name: Upload Windows Server package
        uses: actions/upload-artifact@v4
        with:
          name: CrystalOTC-WindowsServer-OpenGL-x64
          path: artifacts/windows-server
          if-no-files-found: error

  release:
    name: Update Windows Server package in "latest"
    needs: build-windows-server
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows Server package
        uses: actions/download-artifact@v4
        with:
          name: CrystalOTC-WindowsServer-OpenGL-x64
          path: artifacts

      - name: Zip Windows Server package
        run: cd artifacts && zip -r ../CrystalOTC-WindowsServer-OpenGL-x64.zip .

      - name: Add package to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest CrystalOTC-WindowsServer-OpenGL-x64.zip \
            -R "$GITHUB_REPOSITORY" \
            --clobber
